version: 1
jobs:
  build:
    image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    cache:
      key: build-${{ hashFiles("go.sum") }}
      paths:
        - .cache
    steps:
      - name: build artifact
        run: mkdir -p .cache dist && echo cached > .cache/state.txt && echo binary > dist/app.txt
    artifacts:
      - dist/app.txt
  test:
    image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    needs:
      - build
    matrix:
      go:
        - "1.22"
        - "1.23"
    env:
      GO_VERSION: ${{ matrix.go }}
    steps:
      - name: run tests
        run: echo testing ${{ matrix.go }}
